name: Release

# Tag-driven. Pushing `v0.1.0` builds installers for all three platforms and
# attaches them to a draft GitHub Release, which is then published by hand —
# a draft is the last chance to notice that something built but is wrong.
on:
  push:
    tags:
      - "v*"
  # Also runnable by hand, so the pipeline itself can be exercised without
  # burning a version number on a tag that may not ship.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (leave blank to build the current commit)"
        required: false
        type: string

# Needed by tauri-action to create the release and upload artifacts.
permissions:
  contents: write

# Every action below is pinned to a commit, with its version beside it. A tag
# such as `@v0` can be moved by whoever controls that repository, and the
# next release would run whatever it points at then — with this repository's
# token and the power to publish its installers. Bumping one is a deliberate
# edit, and `tests/release.rs` refuses anything that is not pinned.

jobs:
  # One draft, created before anything builds, that every platform attaches
  # to by id. Left to find or create it themselves, builds that finish within
  # a second of each other each made their own: two drafts with one tag.
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.sha) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Create the draft, or reuse this tag's draft on a re-run
        id: draft
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
            body=$(cat <<EOF
          Download the installer for your platform below — or install in one line, as the README shows.

          Builds are currently unsigned (macOS builds carry an ad-hoc signature), so macOS and Windows
          warn on first launch of a file downloaded by hand. See \`docs/RELEASING.md\` for what turning
          signing on requires.

          Every file is listed in \`SHA256SUMS\` and attested to the workflow that built it, and
          \`jky-terminal.spdx.json\` lists every dependency. To check a download:
          \`sha256sum -c SHA256SUMS --ignore-missing\`, then
          \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`.
          EOF
            )
            # Drafted, not published: the last chance to notice that something
            # built cleanly and is still wrong.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="JKY Terminal $version" \
              -f body="$body" -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Draft $id for $TAG"

  release:
    name: ${{ matrix.label }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: a macOS signing
      # problem should still leave you with working Linux and Windows builds.
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu still supported, not the newest: an AppImage
          # runs only where glibc is at least as new as the builder's, so
          # this is what lets it start on Ubuntu 22.04, Debian 12 and RHEL 9.
          - os: ubuntu-22.04
            label: Linux (deb, rpm, AppImage)
            args: ""
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            label: Windows (msi, exe)
            args: ""

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, package-manager-cache: false }
      - run: corepack enable
        shell: bash

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # macOS runners are Apple Silicon, so the Intel build is a cross
          # compile and needs its target installed explicitly.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Tauri needs GTK/WebKit development headers on Linux only. macOS uses
      # WKWebView and Windows uses WebView2, both already on the runners.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.os }}-${{ matrix.args }}

      - run: pnpm install --frozen-lockfile
        shell: bash

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is off until there are certificates to sign with. See
          # docs/RELEASING.md — the pipeline works without them, it just
          # produces builds the OS will warn about on first run.
          #
          # macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          #          APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD,
          #          APPLE_TEAM_ID
          # Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
          # Updater: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }}

  # Checksums, a bill of materials and provenance for everything the builds
  # above attached. A job of its own so it sees every platform's files at
  # once — and, through `needs`, runs only when every platform built:
  # checksums over half a release would vouch for half a release.
  integrity:
    name: Checksums, SBOM and provenance
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the results to the draft release
      id-token: write # sign attestations with this workflow's identity
      attestations: write # store them where `gh attestation verify` looks
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.sha) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download what every platform attached
        run: |
          # Outside the checkout, so the SBOM scan below reads the lockfiles
          # and not the installers.
          FILES="$RUNNER_TEMP/release"
          echo "FILES=$FILES" >> "$GITHUB_ENV"
          mkdir -p "$FILES"
          gh release download "$TAG" --dir "$FILES" --repo "$GITHUB_REPOSITORY" --clobber
          ls -la "$FILES"

      - name: Compute SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        run: |
          # Every installer, in a fixed order, so the list does not depend on
          # which platform finished first. What a re-run downloaded from an
          # earlier pass of this job is not an installer.
          rm -f SHA256SUMS jky-terminal.spdx.json
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - name: Generate the software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: jky-terminal.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest where each file was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS

      - name: Attest the SBOM against the same files
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS
          sbom-path: jky-terminal.spdx.json

      - name: Attach SHA256SUMS and the SBOM to the draft
        run: >
          gh release upload "$TAG" "$FILES/SHA256SUMS" jky-terminal.spdx.json
          --clobber --repo "$GITHUB_REPOSITORY"

  # The draft, installed the way a person will install it — before anyone
  # can. A build can succeed and still not install, or install and not
  # start. The one-line installers from this commit install the draft's own
  # files, served on localhost; the real app stores a shortcut, starts and
  # stays up; then it is uninstalled. Publishing waits for this.
  smoke:
    name: Install and start (${{ matrix.os }})
    needs: integrity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04 is the oldest Ubuntu the AppImage is built for; the latest
        # proves it on a current one.
        os: [ubuntu-22.04, ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: write # a draft is visible only to a token that can write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.sha) }}
      JKY_RELEASE_BASE: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Fetch this platform's installer and SHA256SUMS from the draft
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) pattern='*_amd64.AppImage' ;;
            macOS) pattern='*_aarch64.dmg' ;;
            Windows) pattern='*_x64-setup.exe' ;;
          esac
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/rel" \
            --pattern "$pattern" --pattern SHA256SUMS
          cp install.sh install.ps1 "$RUNNER_TEMP/rel/"
          ls -la "$RUNNER_TEMP/rel"

      - name: Install, store shortcuts, start, uninstall (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          JKY_SCRIPT_URL: http://127.0.0.1:8765/install.sh
        run: |
          set -eu
          (cd "$RUNNER_TEMP/rel" && exec python3 -m http.server 8765 --bind 127.0.0.1) >/dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -fs "$JKY_RELEASE_BASE/SHA256SUMS" >/dev/null && break; sleep 1; done
          want=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$RUNNER_OS" = Linux ]; then
            # A runner is a server, with no graphics stack. Give it what every
            # desktop has, so this checks the app rather than the machine.
            sudo apt-get update -qq
            sudo apt-get install -y -qq libegl1 libgl1 libgbm1 xvfb >/dev/null
          fi

          echo "::group::install, exactly as pasted"
          curl -fsSL "$JKY_RELEASE_BASE/install.sh" | sh -s -- --shortcut "ctrl alt j" | tee "$RUNNER_TEMP/install.out"
          echo "::endgroup::"
          grep -q "Installation complete" "$RUNNER_TEMP/install.out"
          export PATH="$HOME/.local/bin:$PATH"
          test "$(jky version)" = "$want"

          if [ "$RUNNER_OS" = macOS ]; then
            conf="$HOME/Library/Application Support/dev.jky.terminal/settings.json"
          else
            conf="$HOME/.config/dev.jky.terminal/settings.json"
          fi
          # Stored by the real binary, through --set-shortcut.
          grep -q 'Ctrl+Alt+J' "$conf"
          jky shortcut "super+shift+t" </dev/null
          grep -q 'Shift+Super+T' "$conf"
          jky shortcut none </dev/null
          if grep -q 'Shift+Super+T' "$conf"; then echo "none did not clear it"; exit 1; fi

          echo "::group::start the app"
          if [ "$RUNNER_OS" = macOS ]; then
            jky
            sleep 20
            pgrep -f "JKY Terminal.app/Contents/MacOS/" >/dev/null || { echo "the app did not stay up"; exit 1; }
            pkill -f "JKY Terminal.app/Contents/MacOS/" || true
          else
            # A desktop session has a session bus; the app's single-instance
            # check talks to it.
            status=0
            dbus-run-session -- xvfb-run -a timeout 20 "$HOME/.local/share/jky-terminal/app/AppRun" \
              >"$RUNNER_TEMP/app.log" 2>&1 || status=$?
            cat "$RUNNER_TEMP/app.log"
            # 124: still running when the 20 seconds were up.
            test "$status" = 124 || { echo "the app exited with $status"; exit 1; }
          fi
          echo "::endgroup::"
          sleep 2

          jky uninstall
          test ! -e "$HOME/.local/bin/jky"
          if [ "$RUNNER_OS" = macOS ]; then
            test ! -e "$HOME/Applications/JKY Terminal.app"
          else
            test ! -e "$HOME/.local/share/jky-terminal"
          fi
          test -f "$conf" # settings are kept

      - name: Install, store shortcuts, start, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JKY_SCRIPT_URL: http://127.0.0.1:8765/install.ps1
        run: |
          $ErrorActionPreference = "Stop"
          $server = Start-Process python -ArgumentList @("-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", "$env:RUNNER_TEMP\rel") -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 30; $i++) { try { Invoke-WebRequest -UseBasicParsing "$env:JKY_RELEASE_BASE/SHA256SUMS" | Out-Null; break } catch { Start-Sleep 1 } }
          $want = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version

          # Exactly as pasted, in the Windows PowerShell every machine has.
          $env:JKY_SHORTCUT = "ctrl alt j"
          $out = powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "irm $env:JKY_RELEASE_BASE/install.ps1 | iex" 2>&1 | Out-String
          Remove-Item Env:JKY_SHORTCUT
          Write-Host $out
          if ($out -notmatch "Installation complete") { throw "the installer did not finish" }

          $bin = "$env:LOCALAPPDATA\JKY Terminal Installer\bin"
          $v = (& cmd /c "`"$bin\jky.cmd`" version" | Out-String).Trim()
          if ($v -ne $want) { throw "jky version said '$v', not '$want'" }
          $conf = "$env:APPDATA\dev.jky.terminal\settings.json"
          # Stored by the real binary, through --set-shortcut.
          if (-not (Select-String -Path $conf -Pattern "Ctrl+Alt+J" -SimpleMatch -Quiet)) { throw "the shortcut was not stored" }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\JKY Terminal.lnk"
          $hk = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).Hotkey
          if ($hk -notmatch "Ctrl" -or $hk -notmatch "Alt") { throw "the Start-menu hotkey is '$hk'" }
          & cmd /c "`"$bin\jky.cmd`" shortcut Win+Shift+T"
          if (-not (Select-String -Path $conf -Pattern "Shift+Super+T" -SimpleMatch -Quiet)) { throw "jky shortcut did not store it" }

          $exe = "$env:LOCALAPPDATA\JKY Terminal\jky-terminal.exe"
          $app = Start-Process $exe -PassThru
          Start-Sleep 20
          if ($app.HasExited) { throw "the app exited with $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Start-Sleep 3

          $said = & cmd /c "`"$bin\jky.cmd`" uninstall" 2>&1 | Out-String
          Write-Host $said
          if ($said -match "cannot find|cannot be found") { throw "uninstall printed an error" }
          if (Test-Path $exe) { throw "the app is still installed" }
          if (Test-Path $bin) { throw "jky is still there" }
          if (-not (Test-Path $conf)) { throw "the settings were not kept" }
          Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
