name: CI

on:
  pull_request:
  push:
    branches: [main]

# JKY Terminal ships on macOS, Windows and Linux, so CI must prove all three.
# A green Linux-only pipeline is not evidence of portability.

jobs:
  # Fast feedback: lint, typecheck and unit-test the frontend once. This layer
  # is platform-independent, so running it on three OSes would buy nothing.
  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w typecheck
      - run: pnpm -w lint
      - run: pnpm -w test

  # The portability gate. Every OS we ship on must compile the Rust workspace,
  # pass its tests, and successfully build the real desktop binary.
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing must not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }

      # Tauri needs GTK/WebKit development headers on Linux only. macOS uses
      # WKWebView and Windows uses WebView2, both already present on the runners.
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - run: pnpm install --frozen-lockfile
        shell: bash

      - name: Test Rust workspace
        run: cargo test --workspace
        shell: bash

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash

      # The real portability proof: the shippable binary must link on this OS.
      # Compiling the library is not enough — this is where a platform-specific
      # keychain backend or webview binding actually fails.
      - name: Build the desktop binary
        run: pnpm --filter @jky/desktop build && cargo build -p jky-terminal
        shell: bash

  # Spec §7: the build fails on a high or critical advisory. Kept as its own
  # job so an advisory published overnight is reported as exactly that, rather
  # than looking like the frontend tests broke.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Moderate and below are reported without failing: a dev-server
      # advisory should be visible without blocking a release that does not
      # ship the dev server.
      - name: Audit npm dependencies (report everything)
        run: pnpm audit || true

      - name: Audit npm dependencies (fail on high and critical)
        run: pnpm audit --audit-level high

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # --deny warnings turns unmaintained-crate notices into failures too.
      # Left off deliberately: an unmaintained transitive dependency is worth
      # knowing about and is not a reason to block a release.
      - name: Audit Rust dependencies
        run: cargo audit

  security:
    name: Security assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run clean:dist
      - run: pnpm -w build

      - name: Scan production bundle for credentials
        run: pnpm run scan:bundle

      - name: Assert no secret is committed to the repository
        shell: bash
        run: |
          # Documentation legitimately shows example keys. Code fixtures must
          # opt out explicitly and visibly, one line at a time, so every
          # exemption is reviewable rather than hidden behind a path glob.
          # One pattern per provider we support. A guard that only knows
          # about the first provider stops being a guard the moment a second
          # one is added.
          patterns='sk-ant-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}'
          patterns="$patterns|gsk_[A-Za-z0-9]{20,}|xai-[A-Za-z0-9]{20,}"
          patterns="$patterns|sk-or-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{30,}"
          patterns="$patterns|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}"
          hits=$(git grep -nE "$patterns" -- ':!docs' \
                 | grep -v 'pragma: allowlist secret' || true)
          if [ -n "$hits" ]; then
            echo "SECURITY: an API key is committed to the repository:"
            echo "$hits"
            exit 1
          fi
          echo "No committed credentials found."
