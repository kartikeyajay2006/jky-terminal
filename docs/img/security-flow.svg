<text x="456" y="306" class="s" font-size="18" font-weight="700" fill="#f2f2f8">123 pinned commands</text>
<text x="930" y="278" text-anchor="end" class="m" font-size="12" fill="#8b8ba4">thin wrappers · no secret types</text>
<rect x="430" y="356" width="520" height="84" rx="14" fill="#0e0e18" stroke="#00e5ff" stroke-opacity=".55"/>
<rect x="430" y="356" width="6" height="84" rx="3" fill="#00e5ff"/>
<text x="456" y="388" class="m" font-size="12" letter-spacing="2" fill="#00e5ff" font-weight="700">RUST</text>
<text x="456" y="416" class="s" font-size="18" font-weight="700" fill="#f2f2f8">22 crates</text>
<text x="930" y="388" text-anchor="end" class="m" font-size="12" fill="#8b8ba4">PTYs · files · keys · audit</text>
<rect x="430" y="466" width="520" height="84" rx="14" fill="#0e0e18" stroke="#3ddc97" stroke-opacity=".55"/>
<rect x="430" y="466" width="6" height="84" rx="3" fill="#3ddc97"/>
