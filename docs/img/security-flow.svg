<text x="456" y="526" class="s" font-size="18" font-weight="700" fill="#f2f2f8">shells · files · OS keychain</text>
<text x="930" y="498" text-anchor="end" class="m" font-size="12" fill="#8b8ba4">your permissions, unchanged</text>
