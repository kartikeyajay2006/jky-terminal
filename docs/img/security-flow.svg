<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">The window can ask. Only Rust can act.</title>
<desc id="d">Four layers: the window, 123 pinned IPC commands, the Rust core, and your machine. A file request travels down through every layer and the answer travels back. A request from the window straight to the internet is blocked by the content security policy. The API key stays in the OS keychain; only Rust reads it, only to call a provider.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0d17"/><stop offset="1" stop-color="#05050a"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc97"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#ffb340"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".05"/></pattern>
<clipPath id="card"><rect width="1200" height="600" rx="24"/></clipPath>
</defs>
