<rect x=".75" y=".75" width="1198.5" height="598.5" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/>
<rect x="56" y="0" width="1088" height="3" rx="1.5" fill="url(#edge)"/>
<text x="56" y="60" class="m" font-size="13" letter-spacing="3" fill="#a9a9c2">JKY TERMINAL  <tspan fill="#3ddc97">/</tspan>  SECURITY MODEL</text>
<text x="54" y="102" class="s" font-size="34" font-weight="800" fill="#f2f2f8" letter-spacing="-.6">The window can ask. <tspan fill="#3ddc97">Only Rust can act.</tspan></text>
<rect x="56" y="136" width="330" height="88" rx="14" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".09"/>
<g class="sh1"><rect x="56" y="136" width="330" height="88" rx="14" fill="none" stroke="#00e5ff" stroke-width="1.6"/></g>
<circle cx="84" cy="166" r="7" fill="#00e5ff"/>
<text x="102" y="172" class="s" font-size="18" font-weight="700" fill="#f2f2f8">No secret getters</text>
<text x="80" y="200" class="m" font-size="12.5" fill="#a3a3bb">No IPC command returns a key.</text>
<rect x="56" y="240" width="330" height="88" rx="14" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".09"/>
<g class="sh2"><rect x="56" y="240" width="330" height="88" rx="14" fill="none" stroke="#3ddc97" stroke-width="1.6"/></g>
<circle cx="84" cy="270" r="7" fill="#3ddc97"/>
<text x="102" y="276" class="s" font-size="18" font-weight="700" fill="#f2f2f8">connect-src 'self'</text>
<text x="80" y="304" class="m" font-size="12.5" fill="#a3a3bb">The window cannot reach the network.</text>
<rect x="56" y="344" width="330" height="88" rx="14" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".09"/>
<g class="sh3"><rect x="56" y="344" width="330" height="88" rx="14" fill="none" stroke="#bd93f9" stroke-width="1.6"/></g>
<circle cx="84" cy="374" r="7" fill="#bd93f9"/>
<text x="102" y="380" class="s" font-size="18" font-weight="700" fill="#f2f2f8">123 commands, pinned</text>
<text x="80" y="408" class="m" font-size="12.5" fill="#a3a3bb">A test lists every one by name.</text>
<rect x="56" y="448" width="330" height="88" rx="14" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".09"/>
<g class="sh4"><rect x="56" y="448" width="330" height="88" rx="14" fill="none" stroke="#ffb340" stroke-width="1.6"/></g>
<circle cx="84" cy="478" r="7" fill="#ffb340"/>
<text x="102" y="484" class="s" font-size="18" font-weight="700" fill="#f2f2f8">Folders you open</text>
<text x="80" y="512" class="m" font-size="12.5" fill="#a3a3bb">Paths are canonicalised and contained.</text>
<rect x="430" y="136" width="520" height="84" rx="14" fill="#0e0e18" stroke="#ff4d6a" stroke-opacity=".55"/>
<rect x="430" y="136" width="6" height="84" rx="3" fill="#ff4d6a"/>
<text x="456" y="168" class="m" font-size="12" letter-spacing="2" fill="#ff4d6a" font-weight="700">WINDOW</text>
<text x="456" y="196" class="s" font-size="18" font-weight="700" fill="#f2f2f8">React · xterm.js · the editor</text>
<text x="930" y="168" text-anchor="end" class="m" font-size="12" fill="#8b8ba4">untrusted by design</text>
<rect x="430" y="246" width="520" height="84" rx="14" fill="#0e0e18" stroke="#bd93f9" stroke-opacity=".55"/>
<rect x="430" y="246" width="6" height="84" rx="3" fill="#bd93f9"/>
