<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="JKY Terminal architecture: the window asks, only Rust acts">
<title>The window can ask. Only Rust can act.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08080c"/>
    <stop offset="1" stop-color="#0e1018"/>
  </linearGradient>
</defs>
<style>
  .ttl { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #e8e8f2; }
  .sub { font: 12px ui-monospace, monospace; fill: #9aa8c0; }
  .badge { font: 10px ui-monospace, monospace; fill: #00e5ff; letter-spacing: .06em; }
  .arrow { stroke: #00e5ff; stroke-width: 1.6; fill: none; opacity: .75; }
  .arrowtext { font: 11px ui-monospace, monospace; fill: #7fd6e6; }
  .caption { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #c3ccd9; }
  .rule { font: 600 17px ui-sans-serif, system-ui, sans-serif; fill: #e8e8f2; }
</style>
<rect width="860" height="430" fill="url(#bg)"/>

<text x="40" y="52" class="rule">The window can ask.</text>
<text x="40" y="76" class="rule">Only Rust can act.</text>
<text x="40" y="112" class="caption">A request leaves the window as a name</text>
<text x="40" y="132" class="caption">and an argument. Nothing else crosses.</text>

<text x="40" y="196" class="arrowtext">ask ↓</text>
<text x="40" y="228" class="arrowtext">answer ↑</text>
<path class="arrow" d="M 120 190 C 200 190 220 150 300 130"/>
<path class="arrow" d="M 300 236 C 220 258 200 226 120 222"/>

  <polygon points="265.5,189.0 265.5,215.0 525.3,365.0 525.3,339.0" fill="#14212d"/>
  <polygon points="525.3,339.0 525.3,365.0 689.8,270.0 689.8,244.0" fill="#101a24"/>
  <polygon points="430.0,94.0 689.8,244.0 525.3,339.0 265.5,189.0" fill="#1b2b3a" stroke="#0b0b12" stroke-width="1.2"/>
  <text x="477.6" y="210.5" text-anchor="middle" class="ttl">Operating system</text>
  <text x="477.6" y="228.5" text-anchor="middle" class="sub">keychain · shell · webview</text>
  <text x="477.6" y="246.5" text-anchor="middle" class="badge">the only privileged thing here</text>
  <polygon points="265.5,111.0 265.5,137.0 525.3,287.0 525.3,261.0" fill="#0d2731"/>
  <polygon points="525.3,261.0 525.3,287.0 689.8,192.0 689.8,166.0" fill="#0a1f27"/>
  <polygon points="430.0,16.0 689.8,166.0 525.3,261.0 265.5,111.0" fill="#123240" stroke="#0b0b12" stroke-width="1.2"/>
  <text x="477.6" y="132.5" text-anchor="middle" class="ttl">Rust</text>
  <text x="477.6" y="150.5" text-anchor="middle" class="sub">crates/ · every capability</text>
  <text x="477.6" y="168.5" text-anchor="middle" class="badge">network · files · secrets</text>
  <polygon points="265.5,33.0 265.5,59.0 525.3,209.0 525.3,183.0" fill="#0b2e39"/>
  <polygon points="525.3,183.0 525.3,209.0 689.8,114.0 689.8,88.0" fill="#08242d"/>
  <polygon points="430.0,-62.0 689.8,88.0 525.3,183.0 265.5,33.0" fill="#0f3b4a" stroke="#0b0b12" stroke-width="1.2"/>
  <text x="477.6" y="54.5" text-anchor="middle" class="ttl">IPC</text>
  <text x="477.6" y="72.5" text-anchor="middle" class="sub">one pinned command list</text>
  <text x="477.6" y="90.5" text-anchor="middle" class="badge">a test names every one</text>
  <polygon points="265.5,-45.0 265.5,-19.0 525.3,131.0 525.3,105.0" fill="#0f2a3c"/>
  <polygon points="525.3,105.0 525.3,131.0 689.8,36.0 689.8,10.0" fill="#0b2130"/>
  <polygon points="430.0,-140.0 689.8,10.0 525.3,105.0 265.5,-45.0" fill="#14364d" stroke="#0b0b12" stroke-width="1.2"/>
  <text x="477.6" y="-23.5" text-anchor="middle" class="ttl">The window</text>
  <text x="477.6" y="-5.5" text-anchor="middle" class="sub">React · no ambient authority</text>
  <text x="477.6" y="12.5" text-anchor="middle" class="badge">connect-src 'self'</text>
</svg>
