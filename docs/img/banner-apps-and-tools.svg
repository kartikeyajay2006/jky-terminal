<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">Apps, tools &amp; games</title><desc id="d">Developer tools, eight apps, a dashboard and an arcade — all optional.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#06060a"/></linearGradient>
<linearGradient id="ttl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#ffb340"/><stop offset=".55" stop-color="#ffffff"/><stop offset=".8" stop-color="#ff3cf0"/><stop offset="1" stop-color="#ffffff"/><animateTransform attributeName="gradientTransform" type="translate" values="-500 0;400 0;-500 0" dur="12s" repeatCount="indefinite"/></linearGradient>
