<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 524" width="860" height="524" role="img" aria-label="The ten sections of JKY Terminal">
<title>Ten sections, one window</title>
<style>
  .glyph { font: 17px ui-monospace, monospace; fill: #00e5ff; }
  .nm { font: 600 14px ui-sans-serif, system-ui, sans-serif; fill: #e8e8f2; }
  .nt { font: 11px ui-monospace, monospace; fill: #6e6e85; }
  .h { font: 600 20px ui-sans-serif, system-ui, sans-serif; fill: #e8e8f2; }
  .c { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #9a9ab2; }
</style>
<rect width="860" height="524" fill="#08080c"/>
<text x="40" y="52" class="h">Ten sections, one window</text>
<text x="40" y="78" class="c">Everything here runs in one process, and reaches the network only through Rust.</text>
<rect x="40" y="94" width="780" height="1" fill="#1e1e2c"/>
<rect x="40" y="118" width="383" height="62" rx="8" fill="#0e0e16" stroke="#00a3b5"/>
<text x="64" y="148" text-anchor="middle" class="glyph">⌂</text>
<text x="88" y="145" class="nm">Dashboard</text>
<text x="88" y="163" class="nt">notes · todos · calendar</text>
<rect x="437" y="118" width="383" height="62" rx="8" fill="#0e0e16" stroke="#00a3b5"/>
<text x="461" y="148" text-anchor="middle" class="glyph">❯</text>
<text x="485" y="145" class="nm">Terminal</text>
<text x="485" y="163" class="nt">a real pty, split any way</text>
<rect x="40" y="194" width="383" height="62" rx="8" fill="#0e0e16" stroke="#2a2a3c"/>
<text x="64" y="224" text-anchor="middle" class="glyph">↺</text>
<text x="88" y="221" class="nm">History</text>
<text x="88" y="239" class="nt">everything you have run</text>
<rect x="437" y="194" width="383" height="62" rx="8" fill="#0e0e16" stroke="#2a2a3c"/>
<text x="461" y="224" text-anchor="middle" class="glyph">⇄</text>
<text x="485" y="221" class="nm">Remote</text>
<text x="485" y="239" class="nt">a terminal on another machine</text>
<rect x="40" y="270" width="383" height="62" rx="8" fill="#0e0e16" stroke="#2a2a3c"/>
<text x="64" y="300" text-anchor="middle" class="glyph">✎</text>
<text x="88" y="297" class="nm">Editor</text>
<text x="88" y="315" class="nt">files, in folders you opened</text>
<rect x="437" y="270" width="383" height="62" rx="8" fill="#0e0e16" stroke="#2a2a3c"/>
<text x="461" y="300" text-anchor="middle" class="glyph">▦</text>
<text x="485" y="297" class="nm">Workspaces</text>
<text x="485" y="315" class="nt">your setup, under a name</text>
<rect x="40" y="346" width="383" height="62" rx="8" fill="#0e0e16" stroke="#2a2a3c"/>
<text x="64" y="376" text-anchor="middle" class="glyph">✦</text>
<text x="88" y="373" class="nm">Assistant</text>
<text x="88" y="391" class="nt">your key, your machine</text>
<rect x="437" y="346" width="383" height="62" rx="8" fill="#0e0e16" stroke="#2a2a3c"/>
<text x="461" y="376" text-anchor="middle" class="glyph">◈</text>
<text x="485" y="373" class="nm">Games</text>
<text x="485" y="391" class="nt">four, and they keep score</text>
<rect x="40" y="422" width="383" height="62" rx="8" fill="#0e0e16" stroke="#2a2a3c"/>
<text x="64" y="452" text-anchor="middle" class="glyph">⊞</text>
<text x="88" y="449" class="nm">Apps</text>
<text x="88" y="467" class="nt">eight, in tabs</text>
<rect x="437" y="422" width="383" height="62" rx="8" fill="#0e0e16" stroke="#2a2a3c"/>
<text x="461" y="452" text-anchor="middle" class="glyph">⌥</text>
<text x="485" y="449" class="nm">Developer</text>
<text x="485" y="467" class="nt">eleven tools</text>
</svg>
