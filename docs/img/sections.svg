<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-label="The six sections of JKY Terminal">
<title>Six sections, one window</title>
<style>
  .glyph { font: 18px ui-monospace, monospace; fill: #00e5ff; }
  .nm { font: 600 14px ui-sans-serif, system-ui, sans-serif; fill: #e8e8f2; }
  .nt { font: 10px ui-monospace, monospace; fill: #93a2b8; }
  .h { font: 600 19px ui-sans-serif, system-ui, sans-serif; fill: #e8e8f2; }
  .c { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #9aa8c0; }
</style>
<rect width="860" height="520" fill="#08080c"/>
<text x="40" y="56" class="h">Six sections, one window</text>
<text x="40" y="82" class="c">Everything below runs in one process,</text>
<text x="40" y="102" class="c">and reaches the network only through Rust.</text>
    <polygon points="104.7,165.0 104.7,185.0 234.6,260.0 234.6,240.0" fill="#131d31"/>
  <polygon points="234.6,240.0 234.6,260.0 329.9,205.0 329.9,185.0" fill="#0e1626"/>
  <polygon points="200.0,110.0 329.9,185.0 234.6,240.0 104.7,165.0" fill="#1a2740" stroke="#0b0b12" stroke-width="1"/>
  <text x="217.3" y="167.0" text-anchor="middle" class="glyph">⌂</text>
  <text x="217.3" y="185.0" text-anchor="middle" class="nm">Dashboard</text>
  <text x="217.3" y="201.0" text-anchor="middle" class="nt">notes · todos · calendar</text>
  <polygon points="314.7,223.0 314.7,243.0 444.6,318.0 444.6,298.0" fill="#0b2431"/>
  <polygon points="444.6,298.0 444.6,318.0 539.9,263.0 539.9,243.0" fill="#081c26"/>
  <polygon points="410.0,168.0 539.9,243.0 444.6,298.0 314.7,223.0" fill="#0f3040" stroke="#0b0b12" stroke-width="1"/>
  <text x="427.3" y="225.0" text-anchor="middle" class="glyph">❯</text>
  <text x="427.3" y="243.0" text-anchor="middle" class="nm">Terminal</text>
  <text x="427.3" y="259.0" text-anchor="middle" class="nt">a real pty, scrollback kept</text>
  <polygon points="524.7,281.0 524.7,301.0 654.6,376.0 654.6,356.0" fill="#1b1331"/>
  <polygon points="654.6,356.0 654.6,376.0 749.9,321.0 749.9,301.0" fill="#150e26"/>
  <polygon points="620.0,226.0 749.9,301.0 654.6,356.0 524.7,281.0" fill="#241a40" stroke="#0b0b12" stroke-width="1"/>
  <text x="637.3" y="283.0" text-anchor="middle" class="glyph">✦</text>
  <text x="637.3" y="301.0" text-anchor="middle" class="nm">Assistant</text>
  <text x="637.3" y="317.0" text-anchor="middle" class="nt">your key, your machine</text>
  <polygon points="104.7,315.0 104.7,335.0 234.6,410.0 234.6,390.0" fill="#2c1325"/>
  <polygon points="234.6,390.0 234.6,410.0 329.9,355.0 329.9,335.0" fill="#220e1d"/>
  <polygon points="200.0,260.0 329.9,335.0 234.6,390.0 104.7,315.0" fill="#3a1a30" stroke="#0b0b12" stroke-width="1"/>
  <text x="217.3" y="317.0" text-anchor="middle" class="glyph">◈</text>
  <text x="217.3" y="335.0" text-anchor="middle" class="nm">Games</text>
  <text x="217.3" y="351.0" text-anchor="middle" class="nt">four, and they keep score</text>
  <polygon points="314.7,373.0 314.7,393.0 444.6,468.0 444.6,448.0" fill="#102c21"/>
  <polygon points="444.6,448.0 444.6,468.0 539.9,413.0 539.9,393.0" fill="#0c2219"/>
  <polygon points="410.0,318.0 539.9,393.0 444.6,448.0 314.7,373.0" fill="#153a2c" stroke="#0b0b12" stroke-width="1"/>
  <text x="427.3" y="375.0" text-anchor="middle" class="glyph">⊞</text>
  <text x="427.3" y="393.0" text-anchor="middle" class="nm">Apps</text>
  <text x="427.3" y="409.0" text-anchor="middle" class="nt">eight, in tabs</text>
  <polygon points="524.7,431.0 524.7,451.0 654.6,526.0 654.6,506.0" fill="#2c2712"/>
  <polygon points="654.6,506.0 654.6,526.0 749.9,471.0 749.9,451.0" fill="#221e0e"/>
  <polygon points="620.0,376.0 749.9,451.0 654.6,506.0 524.7,431.0" fill="#3a3418" stroke="#0b0b12" stroke-width="1"/>
  <text x="637.3" y="433.0" text-anchor="middle" class="glyph">⌥</text>
  <text x="637.3" y="451.0" text-anchor="middle" class="nm">Developer</text>
  <text x="637.3" y="467.0" text-anchor="middle" class="nt">eleven tools</text>
</svg>
