<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">Security &amp; privacy</title><desc id="d">The window can ask. Only Rust can act. Here is exactly how.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#06060a"/></linearGradient>
<linearGradient id="ttl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#3ddc97"/><stop offset=".55" stop-color="#ffffff"/><stop offset=".8" stop-color="#00e5ff"/><stop offset="1" stop-color="#ffffff"/><animateTransform attributeName="gradientTransform" type="translate" values="-500 0;400 0;-500 0" dur="12s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc97"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#ffb340"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
