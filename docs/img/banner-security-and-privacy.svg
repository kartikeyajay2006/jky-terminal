<text x="816" y="144" class="m o" font-size="11.5" fill="#c9c9dc" style="animation-delay:0.00s">… connect-src &#x27;self&#x27; ipc: http://ipc.localhost</text>
<text x="816" y="170" class="m o" font-size="12.5" fill="#8b8ba4" style="animation-delay:0.25s"># no external host — a test enforces it</text>
