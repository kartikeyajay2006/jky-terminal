<text x="54" y="142" class="s" font-size="54" font-weight="800" letter-spacing="-1.2" fill="url(#ttl)">Security &amp; privacy</text>
<text x="56" y="182" class="s" font-size="18.5" fill="#cfcfe0">The window can ask. Only Rust can act. Here is exactly how.</text>
