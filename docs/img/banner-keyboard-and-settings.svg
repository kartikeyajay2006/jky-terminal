<g class="blink"><rect x="828" y="100" width="8" height="16" rx="1" fill="#ff3cf0"><animate attributeName="x" dur="7s" repeatCount="indefinite" calcMode="discrete" values="828.0;828.0;836.4;844.8;853.2;861.6;870.0;878.4;886.8;895.2;903.6;912.0;920.4;928.8;937.2;945.6;954.0;954.0" keyTimes="0.0000;0.0800;0.1013;0.1227;0.1440;0.1653;0.1867;0.2080;0.2293;0.2507;0.2720;0.2933;0.3147;0.3360;0.3573;0.3787;0.4000;1.0000"/></rect></g>
<text x="816" y="144" class="m o" font-size="12.5" fill="#c9c9dc" style="animation-delay:0.00s">{ &quot;bindings&quot;: {</text>
<text x="816" y="170" class="m o" font-size="12.5" fill="#c9c9dc" style="animation-delay:0.25s">    &quot;pane-split-down&quot;: &quot;Ctrl+Alt+D&quot;</text>
