<g class="pop" style="animation-delay:0.5s"><rect x="153.2" y="212" width="72" height="30" rx="15" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".55"/><circle cx="168.2" cy="227" r="3.5" fill="#3ddc97"/><text x="178.2" y="232" class="m" font-size="12.5" fill="#ececf6">OSC 7</text></g>
<g class="pop" style="animation-delay:1.0s"><rect x="235.2" y="212" width="171" height="30" rx="15" fill="#00e5ff" fill-opacity=".12" stroke="#00e5ff" stroke-opacity=".55"/><circle cx="250.2" cy="227" r="3.5" fill="#00e5ff"/><text x="260.2" y="232" class="m" font-size="12.5" fill="#ececf6">no dotfiles edited</text></g>
