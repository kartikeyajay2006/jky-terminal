<text x="54" y="142" class="s" font-size="48" font-weight="800" letter-spacing="-1.2" fill="url(#ttl)">Shells &amp; the jky command</text>
<text x="56" y="182" class="s" font-size="18.5" fill="#cfcfe0">bash, zsh, fish, Nushell and PowerShell — and a CLI that talks to the app.</text>
