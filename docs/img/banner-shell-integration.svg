<g class="blink"><rect x="828" y="100" width="8" height="16" rx="1" fill="#a3e635"><animate attributeName="x" dur="7s" repeatCount="indefinite" calcMode="discrete" values="828.0;828.0;836.4;844.8;853.2;861.6;870.0;878.4;886.8;895.2;903.6;912.0;920.4;928.8;937.2;945.6;954.0;962.4;970.8;979.2;987.6;996.0;1004.4;1012.8;1021.2;1029.6;1038.0;1046.4;1054.8;1063.2;1071.6;1080.0;1088.4;1088.4" keyTimes="0.0000;0.0800;0.0903;0.1006;0.1110;0.1213;0.1316;0.1419;0.1523;0.1626;0.1729;0.1832;0.1935;0.2039;0.2142;0.2245;0.2348;0.2452;0.2555;0.2658;0.2761;0.2865;0.2968;0.3071;0.3174;0.3277;0.3381;0.3484;0.3587;0.3690;0.3794;0.3897;0.4000;1.0000"/></rect></g>
<text x="816" y="144" class="m o" font-size="12.5" fill="#8b8ba4" style="animation-delay:0.00s"># the question opens in the Assistant</text>
<text x="816" y="170" class="m o" font-size="12.5" fill="#8b8ba4" style="animation-delay:0.25s"># outside JKY it prints nothing</text>
<text x="816" y="196" class="m o" font-size="12.5" fill="#8b8ba4" style="animation-delay:0.50s"># and does no harm</text>
