<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">JKY Terminal animated theme gallery</title>
  <desc id="desc">Seven colourful JKY Terminal theme cards glow in sequence while a terminal command line changes colour.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0a0b12"/><stop offset="1" stop-color="#14101e"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#ff3cf0"/><stop offset="1" stop-color="#ffb340"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label{font:600 12px Inter,Arial,sans-serif;fill:#f5f5fa}.small{font:10px ui-monospace,monospace;fill:#a9afc4}.card{animation:pulse 10.5s infinite}.c1{animation-delay:0s}.c2{animation-delay:1.5s}.c3{animation-delay:3s}.c4{animation-delay:4.5s}.c5{animation-delay:6s}.c6{animation-delay:7.5s}.c7{animation-delay:9s}.scan{animation:scan 10.5s linear infinite}.cursor{animation:blink .85s steps(1) infinite}@keyframes pulse{0%,9%,100%{opacity:.72}3%,7%{opacity:1}}@keyframes scan{0%{transform:translateX(0);opacity:0}4%,92%{opacity:1}100%{transform:translateX(770px);opacity:0}}@keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="920" height="360" rx="18" fill="url(#bg)"/>
  <rect x="22" y="20" width="876" height="3" rx="2" fill="url(#line)"/>
  <text x="38" y="62" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f6f7ff">Seven themes, one focused terminal</text>
  <text x="38" y="85" class="small">Animated colour response · token-driven interface · accessible contrast targets</text>
  <g transform="translate(37 114)">
    <g class="card c1"><rect width="112" height="156" rx="10" fill="#08080c" stroke="#00e5ff" stroke-width="2"/><circle cx="16" cy="18" r="6" fill="#00e5ff" filter="url(#glow)"/><text x="28" y="22" class="label" fill="#00e5ff">Cyberpunk</text><rect x="12" y="42" width="88" height="63" rx="5" fill="#111321"/><text x="18" y="64" class="small" fill="#00e5ff">› git status</text><text x="18" y="81" class="small" fill="#ff3cf0">+ changed</text><text x="18" y="98" class="small" fill="#9dff45">✓ clean</text><rect x="12" y="122" width="88" height="20" rx="4" fill="#003b44"/><text x="56" y="136" text-anchor="middle" class="small" fill="#00e5ff">ACTIVE</text></g>
    <g class="card c2" transform="translate(125)"><rect width="112" height="156" rx="10" fill="#282a36" stroke="#bd93f9" stroke-width="2"/><circle cx="16" cy="18" r="6" fill="#bd93f9"/><text x="28" y="22" class="label">Dracula</text><rect x="12" y="42" width="88" height="63" rx="5" fill="#22232d"/><text x="18" y="64" class="small" fill="#bd93f9">› git log</text><text x="18" y="81" class="small" fill="#ff79c6">● b7703</text><text x="18" y="98" class="small" fill="#50fa7b">✓ passed</text><rect x="12" y="122" width="88" height="20" rx="4" fill="#43365c"/></g>
    <g class="card c3" transform="translate(250)"><rect width="112" height="156" rx="10" fill="#2e3440" stroke="#88c0d0" stroke-width="2"/><circle cx="16" cy="18" r="6" fill="#88c0d0"/><text x="28" y="22" class="label">Nord</text><rect x="12" y="42" width="88" height="63" rx="5" fill="#394250"/><text x="18" y="64" class="small" fill="#88c0d0">› test</text><text x="18" y="81" class="small" fill="#a3be8c">ok (3318)</text><text x="18" y="98" class="small">in 04.5s</text><rect x="12" y="122" width="88" height="20" rx="4" fill="#3d5265"/></g>
    <g class="card c4" transform="translate(375)"><rect width="112" height="156" rx="10" fill="#002b36" stroke="#2aa198" stroke-width="2"/><circle cx="16" cy="18" r="6" fill="#2aa198"/><text x="28" y="22" class="label">Solarized</text><rect x="12" y="42" width="88" height="63" rx="5" fill="#073640"/><text x="18" y="64" class="small" fill="#2aa198">› ssh box</text><text x="18" y="81" class="small" fill="#b58900">auth: pki</text><text x="18" y="98" class="small" fill="#859900">connected</text><rect x="12" y="122" width="88" height="20" rx="4" fill="#074b55"/></g>
    <g class="card c5" transform="translate(500)"><rect width="112" height="156" rx="10" fill="#f8f8fc" stroke="#0f62fe" stroke-width="2"/><circle cx="16" cy="18" r="6" fill="#0f62fe"/><text x="28" y="22" class="label" fill="#1d2433">Light</text><rect x="12" y="42" width="88" height="63" rx="5" fill="#fff"/><text x="18" y="64" class="small" fill="#0f62fe">› diff file</text><text x="18" y="81" class="small" fill="#198754">+ added</text><text x="18" y="98" class="small" fill="#d12745">− removed</text><rect x="12" y="122" width="88" height="20" rx="4" fill="#e2ecff"/></g>
    <g class="card c6" transform="translate(625)"><rect width="112" height="156" rx="10" fill="#120e06" stroke="#ffb340" stroke-width="2"/><circle cx="16" cy="18" r="6" fill="#ffb340"/><text x="28" y="22" class="label" fill="#ffcb6b">Gold</text><rect x="12" y="42" width="88" height="63" rx="5" fill="#1e1709"/><text x="18" y="64" class="small" fill="#ffb340">› cargo b</text><text x="18" y="81" class="small" fill="#f28c18">Finished</text><text x="18" y="98" class="small" fill="#10b981">release [ok]</text><rect x="12" y="122" width="88" height="20" rx="4" fill="#3d2a04"/></g>
    <g class="card c7" transform="translate(750)"><rect width="112" height="156" rx="10" fill="#000" stroke="#fff" stroke-width="2"/><circle cx="16" cy="18" r="6" fill="#00ffff"/><text x="28" y="22" class="label">Contrast</text><rect x="12" y="42" width="88" height="63" rx="5" fill="#080808"/><text x="18" y="64" class="small" fill="#00ffff">› 21:1</text><text x="18" y="81" class="small" fill="#ffff00">max edge</text><text x="18" y="98" class="small" fill="#fff">contrast</text><rect x="12" y="122" width="88" height="20" rx="4" fill="#fff"/></g>
  </g>
  <g transform="translate(55 314)"><text class="small" fill="#00e5ff">› theme --cycle</text><text x="127" class="small" fill="#f6f7ff">live palette preview</text><rect x="274" y="-10" width="2" height="14" fill="#f6f7ff" class="cursor"/><rect x="0" y="16" width="4" height="2" rx="1" fill="#00e5ff" filter="url(#glow)" class="scan"/></g>
</svg>
