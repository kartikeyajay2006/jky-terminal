<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">JKY Terminal documentation map</title>
<desc id="d">Twelve documentation areas in a grid, lighting up one after another: getting started, terminal guide, shells and the jky command, keyboard and settings, workspaces and editor, assistant and approvals, apps tools and games, security and privacy, architecture, troubleshooting, questions and glossary, comparison and roadmap.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0d17"/><stop offset="1" stop-color="#05050a"/></linearGradient>
