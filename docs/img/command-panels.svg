<text x="54" y="98" class="s" font-size="32" font-weight="800" fill="#f2f2f8" letter-spacing="-.6">Any command can become an app.</text>
<text x="56" y="126" class="s" font-size="16" fill="#c4c4d6">Eight deterministic parsers — no model. The raw output always stays; a pipe makes every one decline.</text>
