<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Any command can become an app</title>
<desc id="d">Four JKY Terminal panels building themselves: git log as a commit timeline, df -h as disk bars sorted fullest first, git status -s split into staged and unstaged, and JSON output as a tree. Each panel sits beneath the raw output, which is never replaced.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0d17"/><stop offset="1" stop-color="#05050a"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#ff3cf0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".05"/></pattern>
<clipPath id="card"><rect width="1200" height="640" rx="24"/></clipPath>
</defs>
