[package]
name = "jky-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
jky-secrets = { path = "../../../crates/jky-secrets" }
jky-settings = { path = "../../../crates/jky-settings" }
jky-keys = { path = "../../../crates/jky-keys" }
jky-live = { path = "../../../crates/jky-live" }
jky-history = { path = "../../../crates/jky-history" }
jky-memory = { path = "../../../crates/jky-memory" }
jky-complete = { path = "../../../crates/jky-complete" }
jky-remote = { path = "../../../crates/jky-remote" }
jky-files = { path = "../../../crates/jky-files" }
jky-workspace = { path = "../../../crates/jky-workspace" }
jky-store = { path = "../../../crates/jky-store" }
jky-pty = { path = "../../../crates/jky-pty" }
jky-ai = { path = "../../../crates/jky-ai" }
jky-audit = { path = "../../../crates/jky-audit" }
jky-redact = { path = "../../../crates/jky-redact" }
jky-capture = { path = "../../../crates/jky-capture" }
jky-apps = { path = "../../../crates/jky-apps" }
jky-system = { path = "../../../crates/jky-system" }
jky-ports = { path = "../../../crates/jky-ports" }
jky-detach = { path = "../../../crates/jky-detach" }
jky-tools = { path = "../../../crates/jky-tools" }
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# The config folder for `--verify-audit` when it is run by hand.
dirs = "6"
# The summon shortcut, registered from Rust only — no capability gives the
# window either plugin. See src/summon.rs.
tauri-plugin-global-shortcut = "2.4"
# Launching JKY while it is open brings the open window forward, so `jky`,
# an OS-level shortcut and a second click all land on the same window.
tauri-plugin-single-instance = "2.5"

[target.'cfg(windows)'.dependencies]
# AttachConsole, so `--verify-audit` can print from a GUI-subsystem build.
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
interprocess = "2.4"
tempfile = "3"
# To leave a database the way a newer build would, in state.rs's tests.
rusqlite = { version = "0.40", features = ["bundled"] }
