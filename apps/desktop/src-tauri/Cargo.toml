[package]
name = "jky-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
jky-secrets = { path = "../../../crates/jky-secrets" }
jky-settings = { path = "../../../crates/jky-settings" }
jky-keys = { path = "../../../crates/jky-keys" }
jky-live = { path = "../../../crates/jky-live" }
jky-history = { path = "../../../crates/jky-history" }
jky-complete = { path = "../../../crates/jky-complete" }
jky-remote = { path = "../../../crates/jky-remote" }
jky-files = { path = "../../../crates/jky-files" }
jky-workspace = { path = "../../../crates/jky-workspace" }
jky-store = { path = "../../../crates/jky-store" }
jky-pty = { path = "../../../crates/jky-pty" }
jky-ai = { path = "../../../crates/jky-ai" }
jky-audit = { path = "../../../crates/jky-audit" }
jky-capture = { path = "../../../crates/jky-capture" }
jky-apps = { path = "../../../crates/jky-apps" }
jky-system = { path = "../../../crates/jky-system" }
jky-tools = { path = "../../../crates/jky-tools" }
