[package]
name = "jky-detach"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
# Unix domain sockets and Windows named pipes behind one API. The alternative
# was a localhost TCP port, which would mean a listening socket granting shell
# access and an authentication scheme to go with it — a far larger surface
# than a file whose permissions already say who may open it.
interprocess = "2.4"

[dev-dependencies]
# A pipe to stand in for a shell's output, so the supervisor loop is tested
# without spawning a process.
os_pipe = "1.2"
