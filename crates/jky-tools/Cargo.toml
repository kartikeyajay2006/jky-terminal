[package]
name = "jky-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Pinned to the 0.10 line so every hash here shares one `digest` version.
# Mixing 0.10 and 0.11 compiles and gives two `Digest` traits, which reads as
# a mistake every time anyone opens the file.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
similar = "2"
serde_norway = "0.9"
